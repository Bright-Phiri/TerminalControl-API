default: &default
  adapter: postgresql
  encoding: unicode
  # For details on connection pooling, see Rails configuration guide
  # https://guides.rubyonrails.org/configuring.html#database-pooling
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>

development:
  primary: &primary_development
    <<: *default
    database: terminal_control_api_development
  queue:
    <<: *primary_development
    database: terminal_control_api_development_queue
    migrations_paths: db/queue_migrate
  cable:
    <<: *primary_development
    database: terminal_control_api_development_cable
    migrations_paths: db/cable_migrate

test:
  <<: *default
  database: terminal_control_api_test

production:
  primary: &primary_production
    <<: *default
    database: terminal_control_api_production
    username: terminal_control_api
    password: <%= ENV["TERMINAL_CONTROL_API_DATABASE_PASSWORD"] %>
  queue:
    <<: *primary_production
    database: terminal_control_api_production_queue
    migrations_paths: db/queue_migrate
  cable:
    <<: *primary_production
    database: terminal_control_api_production_cable
    migrations_paths: db/cable_migrate
