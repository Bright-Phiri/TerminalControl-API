development:
  block_unpaid_taxpayer_terminals:
    class: BlockTaxpayerTerminalsJob
    queue: terminal_blocking
    schedule: "every day at 3:00am"

  subscription_expiry_check:
    class: SubscriptionExpiryJob
    queue: subscription_reminders
    schedule: "every 20 seconds"

production:
  block_unpaid_taxpayer_terminals:
    class: BlockTaxpayerTerminalsJob
    queue: terminal_blocking
    schedule: "every 4 minutes"

  subscription_expiry_check:
    class: SubscriptionExpiryJob
    queue: subscription_reminders
    schedule: "every 4 minutes"

