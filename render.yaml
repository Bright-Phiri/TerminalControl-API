databases:
  - name: terminal-control-primary-db
  - name: terminal-control-cache-db
  - name: terminal-control-queue-db
  - name: terminal-control-cable-db

services:
  - type: web
    name: terminal-control-api-web
    env: ruby
    plan: free
    repo: https://github.com/your-username/your-repo
    branch: main
    buildCommand: "./bin/render-build.sh"
    startCommand: "bundle exec puma -C config/puma.rb"
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: terminal-control-primary-db
          property: connectionString
      - key: CACHE_DATABASE_URL
        fromDatabase:
          name: terminal-control-cache-db
          property: connectionString
      - key: QUEUE_DATABASE_URL
        fromDatabase:
          name: terminal-control-queue-db
          property: connectionString
      - key: CABLE_DATABASE_URL
        fromDatabase:
          name: terminal-control-cable-db
          property: connectionString
      - key: RAILS_MASTER_KEY
        sync: false
      - key: RAILS_ENV
        value: production

  - type: worker
    name: terminal-control-api-worker
    env: ruby
    plan: free
    repo: https://github.com/your-username/your-repo
    branch: main
    buildCommand: "./bin/render-build.sh"
    startCommand: "bundle exec rails solid_queue:start"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: terminal-control-primary-db
          property: connectionString
      - key: QUEUE_DATABASE_URL
        fromDatabase:
          name: terminal-control-queue-db
          property: connectionString
      - key: RAILS_MASTER_KEY
        sync: false
      - key: RAILS_ENV
        value: production

  - type: worker
    name: terminal-control-api-cable
    env: ruby
    plan: free
    repo: https://github.com/your-username/your-repo
    branch: main
    buildCommand: "./bin/render-build.sh"
    startCommand: "bundle exec rails solid_cable"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: terminal-control-primary-db
          property: connectionString
      - key: CABLE_DATABASE_URL
        fromDatabase:
          name: terminal-control-cable-db
          property: connectionString
      - key: RAILS_MASTER_KEY
        sync: false
      - key: RAILS_ENV
        value: production
